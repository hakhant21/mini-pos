name: mini-pos

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: mini-pos:latest
        restart: unless-stopped
        working_dir: /var/www
        env_file:
            - path: .env
              required: false
        environment:
            APP_ENV: production
            APP_URL: ${APP_URL:-http://localhost:${APP_PORT:-80}}
            DB_CONNECTION: sqlite
            DB_DATABASE: /var/www/database/database.sqlite
            SESSION_DRIVER: database
            CACHE_STORE: database
            QUEUE_CONNECTION: database
        volumes:
            - app_code:/var/www
            - sqlite_data:/var/www/database/
            - storage_data:/var/www/storage/app
            - storage_logs:/var/www/storage/logs

    caddy:
        image: caddy:2-alpine
        restart: unless-stopped
        depends_on:
            - app
        ports:
            - "${APP_PORT:-80}:80"
        volumes:
            - app_code:/var/www:ro
            - storage_data:/var/www/storage/app:ro
            - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config

volumes:
    app_code:
    sqlite_data:
    storage_data:
    storage_logs:
    caddy_data:
    caddy_config:
