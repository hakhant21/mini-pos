services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: minipos
    container_name: backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./storage:/var/www/storage
    environment:
      APP_URL: ${APP_URL:-http://localhost:9000}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-minipos}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-asdffdsa}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    networks:
      - laravel-net
    depends_on:
      - mysql
      - redis

  # REPLACE nginx with Caddy!
  caddy:
    image: caddy:2-alpine # ARM-compatible
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 (optional)
    volumes:
      - ./:/var/www
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - laravel-net
    depends_on:
      - app

  mysql:
    image: mariadb:latest
    container_name: mysql
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      TZ: "Asia/Yangon"
      MYSQL_DATABASE: ${DB_DATABASE:-fms}
      MYSQL_PASSWORD: ${DB_PASSWORD:-fms}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-fms}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel-net
    command: --innodb_use_native_aio=0

  redis:
    image: redis:alpine
    container_name: laravel-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - laravel-net

networks:
  laravel-net:
    driver: bridge

volumes:
  db_data:
  redis_data:
  caddy_data:
  caddy_config:
