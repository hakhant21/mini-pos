server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Handle Inertia.js requests
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static assets with cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map|webp)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }

    # Vite assets
    location ~* \.(vite|hot|manifest)\.json$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
        access_log off;
        log_not_found off;
    }

    # PHP processing
    location ~ \.php$ {
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param PHP_VALUE "upload_max_filesize = 100M \n post_max_size = 100M";

        # Inertia specific headers
        fastcgi_param HTTP_X_INERTIA $http_x_inertia;
        fastcgi_param HTTP_X_INERTIA_VERSION $http_x_inertia_version;
        fastcgi_param HTTP_X_INERTIA_PARTIAL_DATA $http_x_inertia_partial_data;
        fastcgi_param HTTP_X_INERTIA_PARTIAL_COMPONENT $http_x_inertia_partial_component;

        # Laravel specific
        fastcgi_param HTTP_X_REQUESTED_WITH $http_x_requested_with;
        fastcgi_param HTTP_REFERER $http_referer;

        include fastcgi_params;
        fastcgi_intercept_errors off;
    }

    # Deny access to hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Deny access to sensitive directories
    location ~ ^/(config|database|storage|tests|app)/ {
        deny all;
    }

    # Handle 404 errors
    error_page 404 /index.php;
}
