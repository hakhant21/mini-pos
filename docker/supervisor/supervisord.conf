[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-artisan-serve]
command=php artisan serve --host=0.0.0.0 --port=8000
directory=/var/www
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/artisan-serve.log
stderr_logfile=/var/log/artisan-serve-error.log
