name: mini-pos

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: minipos
        image: mini-pos:latest
        restart: unless-stopped
        working_dir: /var/www
        environment:
            APP_ENV: production
            APP_URL: http://${APP_DOMAIN:-bee-kyal.local}:${APP_PORT:-80}
            DB_CONNECTION: sqlite
            DB_DATABASE: /var/www/database/database.sqlite
            SESSION_DRIVER: file
            CACHE_STORE: file
            QUEUE_CONNECTION: database
        volumes:
            - app_code:/var/www
            - sqlite_data:/var/www/database/
            - storage_data:/var/www/storage/app
            - storage_logs:/var/www/storage/logs
        networks:
            - minipos_network

    caddy:
        container_name: caddy
        image: caddy:2-alpine
        restart: unless-stopped
        ports:
            - "${APP_PORT:-80}:80"
        volumes:
            - app_code:/var/www:ro
            - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            - app
        networks:
            - minipos_network

volumes:
    app_code:
    sqlite_data:
    storage_data:
    storage_logs:
    caddy_data:
    caddy_config:

networks:
    minipos_network:
        driver: bridge
