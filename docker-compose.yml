services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: minipos
        image: mini-pos:latest
        restart: unless-stopped
        working_dir: /var/www
        environment:
            APP_ENV: production
            APP_URL: http://${APP_DOMAIN:-bee-kyal.lan}:${APP_PORT:-80}
            DB_CONNECTION: ${DB_CONNECTION:-mysql}
            DB_HOST: ${DB_HOST:-mysql}
            DB_PORT: ${DB_PORT:-3306}
            DB_DATABASE: ${DB_DATABASE:-minipos}
            DB_USERNAME: ${DB_USERNAME:-minipos}
            DB_PASSWORD: ${DB_PASSWORD:-secret}
            SESSION_DRIVER: file
            CACHE_STORE: file
            QUEUE_CONNECTION: database
        ports:
            - "${APP_PORT:-80}:80"
        volumes:
            - app_code:/var/www
            - storage_data:/var/www/storage/app
            - storage_logs:/var/www/storage/logs
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - minipos_network

    mysql:
        image: mysql:8.0
        container_name: mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-minipos}
            MYSQL_USER: ${DB_USERNAME:-minipos}
            MYSQL_PASSWORD: ${DB_PASSWORD:-asdffdsa}
        ports:
            - "${DB_PORT:-3306}"
        volumes:
            - mysql_data:/var/lib/mysql
            - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
        command:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --default-authentication-plugin=mysql_native_password
        networks:
            - minipos_network
        healthcheck:
            test:
                [
                    "CMD",
                    "mysqladmin",
                    "ping",
                    "-h",
                    "localhost",
                    "-u",
                    "root",
                    "-p${DB_ROOT_PASSWORD:-asdffdsa}",
                ]
            timeout: 20s
            retries: 10
            interval: 10s

volumes:
    app_code:
    mysql_data:
    storage_data:
    storage_logs:

networks:
    minipos_network:
        driver: bridge
