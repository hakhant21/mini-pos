services:
  app:
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - app_storage:/var/www/storage
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8000}
      APP_KEY: ${APP_KEY:?APP_KEY must be set}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-minipos}
      DB_USERNAME: minipos
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - laravel-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  redis:
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - laravel-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - app_storage:/var/www/storage
    depends_on:
      app:
        condition: service_healthy
    networks:
      - laravel-net
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mysql:
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      TZ: "Asia/Yangon"
      MYSQL_DATABASE: ${DB_DATABASE:-minipos}
      MYSQL_USER: minipos
      MYSQL_PASSWORD: ${DB_PASSWORD:-asdffdsa}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-asdffdsa}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel-net
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  laravel-net:
    driver: bridge

volumes:
  app_storage:
  db_data:
  redis_data:
