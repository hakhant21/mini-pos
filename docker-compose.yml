name: mini-pos

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: minipos
        image: mini-pos:latest
        restart: unless-stopped
        working_dir: /var/www
        env_file:
            - path: .env
              required: false
        environment:
            APP_ENV: production
            APP_URL: ${APP_URL:-https://bee-kyal.local}
            APP_DOMAIN: ${APP_DOMAIN:-bee-kyal.local}
            DB_CONNECTION: sqlite
            DB_DATABASE: /var/www/database/database.sqlite
            SESSION_DRIVER: database
            CACHE_STORE: database
            QUEUE_CONNECTION: database
            # Trust proxies (important for HTTPS behind Caddy)
            TRUSTED_PROXIES: "172.*"
        volumes:
            - app_code:/var/www
            - sqlite_data:/var/www/database/
            - storage_data:/var/www/storage/app
            - storage_logs:/var/www/storage/logs
        networks:
            - minipos_network

    caddy:
        container_name: caddy
        image: caddy:2-alpine
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - app_code:/var/www:ro
            - storage_data:/var/www/storage/app:ro
            - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            - app
        networks:
            - minipos_network

volumes:
    app_code:
    sqlite_data:
    storage_data:
    storage_logs:
    caddy_data:
    caddy_config:

networks:
    minipos_network:
        driver: bridge
